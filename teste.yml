---
- name: Instalar impressora Central Piso 2
  hosts: all
  gather_facts: no

  tasks:

    - name: Instalar impressora compartilhada
      ansible.windows.win_command: >
        rundll32 printui.dll,PrintUIEntry
        /in
        /n "\\192.168.15.131\Central Piso 2"
      async: 120
      poll: 10

    - name: Verificar se instalou
      ansible.windows.win_shell: |
        Get-Printer | Where-Object {$_.Name -like "*Central Piso 2*"}
      register: impressora

    - name: Mostrar resultado
      debug:
        var: impressora.stdout_lines
