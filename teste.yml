---
- name: Inventário dos computadores
  hosts: all
  gather_facts: yes

  tasks:

    - name: Coletar informações
      set_fact:
        inventario:
          computador: "{{ ansible_hostname }}"
          sistema: "{{ ansible_distribution }}"
          versao_windows: "{{ ansible_distribution_version }}"
          usuario: "{{ ansible_user }}"
          memoria: "{{ ansible_memtotal_mb }} MB"

    - name: Pegar IP do computador
      ansible.windows.win_shell: |
        (Get-NetIPAddress -AddressFamily IPv4 | Where-Object {$_.IPAddress -notlike "169.*" -and $_.IPAddress -ne "127.0.0.1"}).IPAddress
      register: ip_pc

    - name: Mostrar inventário
      debug:
        msg:
          - "Computador: {{ inventario.computador }}"
          - "Sistema: {{ inventario.sistema }}"
          - "Versão: {{ inventario.versao_windows }}"
          - "Usuário: {{ inventario.usuario }}"
          - "Memória: {{ inventario.memoria }}"
          - "IP: {{ ip_pc.stdout_lines }}"
