---
- name: Coletar informações dos computadores
  hosts: windows
  gather_facts: yes

  tasks:

    - name: Mostrar informações dos PCs
      debug:
        msg:
          - "Nome do computador: {{ ansible_hostname }}"
          - "Sistema operacional: {{ ansible_distribution }}"
          - "Versão do Windows: {{ ansible_distribution_version }}"
          - "Usuário conectado: {{ ansible_user }}"
          - "Arquitetura: {{ ansible_architecture }}"
          - "IP: {{ ansible_ip_addresses }}"
          - "Memória RAM: {{ ansible_memtotal_mb }} MB"
